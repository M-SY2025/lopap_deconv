[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lopap_deconv"
version = "0.1.0"
description = "LOPAP signal deconvolution using a dual inverse-Gaussian IRF"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "flake8"]
